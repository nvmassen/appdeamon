#test_app:
#  module: test
#  class: light_on

update_energy_sensors:
  module: update_energy_sensors
  class: UpdateEnergySensors

energy_management_EV:
  path_to_config: '/config/energy_management_EV_config.json'
  module: energy_management_EV
  class: EnergyManagementEV

# OpenClaw Control - REST API for entity control
openclaw_control:
  module: openclaw_control
  class: OpenClawControl
  api_key: !secret openclaw_api_key  # Add to secrets.yaml: openclaw_api_key: "your-secret-key"
  entities:
    # All lights from Home Assistant
    - light.living_eettafel
    - light.slaapkamer_ouders
    - light.tv_hoek
    - light.veranda
    - light.kelder
    - light.keuken


